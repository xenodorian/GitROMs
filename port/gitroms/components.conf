# Things "[Check for updates]" keeps current. One per line:
#   name|zip or file|download URL|destination|keep list|self|source of the modified time (optional)
# zip  = a bundle that unpacks into the ports folder (destination "."). Only
#        the files that differ from what is on the card are downloaded.
# file = one file; destination is its path inside the ports folder. It is
#        offered as an update whenever its modified time on the server differs
#        from the one recorded at the last install.
# keep list = files (paths as inside the zip, comma separated) that are installed
#        only if missing, so your edits are never overwritten.
# self = this entry updates GitROMs itself (you must reopen it afterwards).
# Modified time = the Last-Modified header of the download. A file hosted on
# raw.githubusercontent has none, so give "commit:owner/repo:path/in/repo" as the
# last field and the date of that file's latest commit is used instead.
# Add your own games the same way.
GitROMs|zip|https://github.com/xenodorian/GitROMs/raw/main/dist/GitROMs.zip|.|gitroms/gitroms.conf,gitroms/components.conf|self
