# Things "[Check for updates]" keeps current. One per line:
#   name|zip or file|download URL|destination|keep list|self|source of the modified time|old file to remove (the last two are optional)
# zip  = a bundle that unpacks into the ports folder (destination "."). Only
#        the files that differ from what is on the card are downloaded.
# file = one file; destination is its path inside the ports folder. It is
#        offered as an update whenever its modified time on the server differs
#        from the one recorded at the last install.
# keep list = files (paths as inside the zip, comma separated) that are installed
#        only if missing, so your edits are never overwritten.
# self = this entry updates GitROMs itself (you must reopen it afterwards).
# Updates are decided by commits: "commit:owner/repo:path/in/repo" (the path may be empty for the whole repo) as the source
# of the modified time. Something is offered as a new version only when its latest commit is NEWER than the one recorded at
# the last install; a rebuilt file or a changed Last-Modified alone offers nothing. A file that is cut off or damaged is still
# found (size and checksum) and offered as a repair. Without a commit source the Last-Modified header is used.
# A game is its own package (a launcher plus its own folder), not a file inside the
# emulator's games folder. The last field lists old copies (files or folders under the
# ports folder, comma separated) to remove after a verified install.
# Built-in entries (the entries below) are authoritative: a line here with the same URL
# is corrected to match, and a missing one is added automatically.
# A destination starting with ../ is relative to the ports folder (../gba = the gba roms folder).
# A download URL of the form "find:owner/repo:File.gba" means: look the file up by name in that repo's main branch (accents and case
# are ignored, spaces are not; the copy nearest the top of the repo wins), wherever it is committed. Until it exists the entry says
# "Not published yet". The commit source is filled in from the path that was found.
# Add your own games the same way.
